name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: Public-surface check
        run: node scripts/ci/check-public.mjs
      - name: Link check
        run: node scripts/ci/check-links.mjs
      - name: Unit tests
        run: node --test --test-timeout=20000 "clients/**/*.test.mjs" "harness/**/*.test.mjs" "scripts/**/*.test.mjs"
      - name: shellcheck
        run: shellcheck clients/bin/* scripts/spark/*.sh
      - name: Patch check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: git diff --check HEAD^ HEAD
